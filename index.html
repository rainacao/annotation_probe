<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f3ed">
  <title>Annotation Probe</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f4f3ed;
      --surface: #fffefa;
      --ink: #20231f;
      --muted: #73766f;
      --line: #dedfd7;
      --accent: #f3d928;
      --accent-soft: #fbf5c5;
      --green: #517863;
      --green-soft: #e7eee8;
      --red: #aa4937;
      --sans: "Avenir Next", Avenir, "Trebuchet MS", sans-serif;
      --serif: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Georgia, serif;
      --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      color: var(--ink);
      background: var(--paper);
      font-family: var(--sans);
      font-size: 13px;
    }
    button, input { font: inherit; }
    button { color: inherit; }
    button:focus-visible, input:focus-visible, .drop-target:focus-visible {
      outline: 2px solid var(--green);
      outline-offset: 2px;
    }
    .app-header {
      height: 66px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 25px;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-mark {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border: 1.5px solid var(--ink);
      font-family: var(--serif);
      font-size: 20px;
      line-height: 1;
      transform: rotate(-4deg);
    }
    .brand-name { font-size: 12px; font-weight: 750; letter-spacing: 1.5px; }
    .brand-subtitle {
      margin-top: 3px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: .5px;
    }
    .header-meta { display: flex; align-items: center; gap: 16px; }
    .session-label { color: var(--muted); font-family: var(--mono); font-size: 10px; }
    .record-indicator {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 88px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 10px;
    }
    .record-dot { width: 7px; height: 7px; border-radius: 50%; background: #b7b9b2; }
    .record-indicator.is-recording { color: var(--red); }
    .record-indicator.is-recording .record-dot { background: var(--red); animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .35; } }

    .app-layout { min-height: calc(100vh - 66px); display: grid; grid-template-columns: 252px minmax(0, 1fr); }
    .sidebar {
      display: flex;
      flex-direction: column;
      min-height: 0;
      border-right: 1px solid var(--line);
      background: #f8f7f1;
    }
    .sidebar-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding: 22px 18px 13px;
    }
    .eyebrow { color: var(--muted); font-family: var(--mono); font-size: 9px; letter-spacing: 1px; text-transform: uppercase; }
    .image-count { color: var(--muted); font-family: var(--mono); font-size: 10px; }
    .image-list { display: flex; flex-direction: column; gap: 4px; padding: 0 9px 12px; overflow-y: auto; }
    .image-row {
      width: 100%;
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr) 24px;
      align-items: center;
      gap: 10px;
      min-height: 58px;
      padding: 7px 8px;
      border: 1px solid transparent;
      background: transparent;
      text-align: left;
      cursor: pointer;
    }
    .image-row:hover { background: #eeede6; }
    .image-row[aria-current="true"] { border-color: #dbd9cd; background: var(--surface); }
    .thumb-wrap {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      overflow: hidden;
      background-color: #edede7;
      background-image: linear-gradient(45deg, #dedfd8 25%, transparent 25%), linear-gradient(-45deg, #dedfd8 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #dedfd8 75%), linear-gradient(-45deg, transparent 75%, #dedfd8 75%);
      background-size: 8px 8px;
      background-position: 0 0, 0 4px, 4px -4px, -4px 0;
    }
    .thumb-wrap img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .image-row-name { display: block; overflow: hidden; color: #333630; font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
    .image-row-index { display: block; margin-top: 4px; color: var(--muted); font-family: var(--mono); font-size: 9px; }
    .ink-mark { width: 6px; height: 6px; border-radius: 50%; background: transparent; }
    .ink-mark.has-ink { background: var(--green); }
    .sidebar-bottom { margin-top: auto; padding: 12px; border-top: 1px solid var(--line); }
    .add-images-button {
      width: 100%;
      height: 38px;
      border: 1px solid #c9c9bf;
      background: var(--surface);
      cursor: pointer;
      font-size: 11px;
      font-weight: 650;
    }
    .add-images-button:hover { border-color: var(--ink); }
    .sidebar-note { padding: 10px 3px 1px; color: var(--muted); font-size: 10px; line-height: 1.5; }

    .workspace { min-width: 0; display: flex; flex-direction: column; }
    .workspace-topline {
      min-height: 55px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 22px;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
    }
    .current-image-title { overflow: hidden; font-family: var(--serif); font-size: 17px; text-overflow: ellipsis; white-space: nowrap; }
    .image-navigation { display: flex; align-items: center; gap: 8px; color: var(--muted); font-family: var(--mono); font-size: 10px; }
    .nav-button, .icon-button {
      width: 30px;
      height: 30px;
      display: inline-grid;
      place-items: center;
      border: 1px solid var(--line);
      background: var(--surface);
      cursor: pointer;
      font-size: 17px;
      line-height: 1;
    }
    .nav-button:hover:not(:disabled), .icon-button:hover:not(:disabled) { border-color: #a4a69e; }
    button:disabled { opacity: .4; cursor: not-allowed; }

    .tool-bar {
      min-height: 62px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      padding: 10px 20px;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
    }
    .tool-group { display: flex; align-items: center; gap: 4px; padding-right: 10px; border-right: 1px solid var(--line); }
    .tool-button {
      min-height: 34px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 0 10px;
      border: 1px solid transparent;
      background: transparent;
      cursor: pointer;
      font-size: 11px;
    }
    .tool-button:hover { background: #f4f3ed; }
    .tool-button[aria-pressed="true"] { border-color: #d7d4be; background: #f8f4d8; }
    .tool-glyph { width: 15px; color: #454841; text-align: center; font-family: var(--serif); font-size: 17px; font-style: italic; }
    .eraser-glyph { width: 12px; height: 9px; border: 1px solid #686b63; transform: rotate(-42deg); }
    .size-control { display: flex; align-items: center; gap: 8px; padding: 0 5px; }
    .size-label { color: var(--muted); font-family: var(--mono); font-size: 9px; text-transform: uppercase; }
    input[type="range"] { width: 76px; accent-color: var(--ink); }
    .size-value { width: 27px; color: var(--muted); font-family: var(--mono); font-size: 10px; text-align: right; }
    .toolbar-spacer { flex: 1; }
    .layer-button { min-height: 32px; display: flex; align-items: center; gap: 7px; border: 0; background: transparent; color: #4b4e47; cursor: pointer; font-size: 10px; }
    .layer-eye { color: var(--green); font-size: 15px; }
    .action-group { display: flex; align-items: center; gap: 6px; }
    .record-button, .export-button {
      min-height: 35px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 12px;
      border: 1px solid var(--ink);
      background: var(--ink);
      color: white;
      cursor: pointer;
      font-size: 10px;
      font-weight: 650;
    }
    .record-button { border-color: #c9c8bf; background: var(--surface); color: var(--ink); }
    .record-button.is-recording { border-color: var(--red); color: var(--red); }
    .record-symbol { width: 8px; height: 8px; border-radius: 50%; background: var(--red); }
    .record-button.is-recording .record-symbol { border-radius: 1px; }
    .export-button:hover { background: #3b4039; }
    .record-button:hover:not(:disabled) { border-color: var(--ink); }

    .stage-area {
      flex: 1;
      min-height: 280px;
      display: grid;
      place-items: center;
      padding: 24px;
      overflow: hidden;
      background-color: #e8e8e1;
      background-image: repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(63, 67, 58, .025) 40px), repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(63, 67, 58, .025) 40px);
    }
    .stage {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 240px;
      display: grid;
      place-items: center;
    }
    .artwork-image, .annotation-canvas {
      position: absolute;
      display: none;
      max-width: none;
      user-select: none;
    }
    .artwork-image { object-fit: fill; pointer-events: none; }
    .annotation-canvas { touch-action: none; cursor: crosshair; }
    .annotation-canvas.is-eraser { cursor: cell; }
    .empty-state {
      width: min(390px, 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 26px;
      text-align: center;
    }
    .empty-state[hidden] { display: none; }
    .empty-illustration {
      position: relative;
      width: 106px;
      height: 84px;
      margin-bottom: 22px;
      border: 1px solid #aaa99d;
      background: #f7f6f0;
      transform: rotate(-3deg);
    }
    .empty-illustration::before, .empty-illustration::after { position: absolute; content: ""; }
    .empty-illustration::before { top: 17px; left: 18px; width: 68px; height: 47px; border: 1px solid #c7c7bc; }
    .empty-illustration::after { top: 41px; left: 29px; width: 46px; height: 4px; background: var(--accent); transform: rotate(-18deg); }
    .empty-title { margin: 0 0 8px; font-family: var(--serif); font-size: 24px; font-weight: 500; }
    .empty-copy { max-width: 290px; margin: 0 0 18px; color: var(--muted); font-size: 11px; line-height: 1.65; }
    .drop-target { border-bottom: 1px solid #aaa99d; cursor: pointer; }
    .stage.is-dragging .empty-state { outline: 2px dashed var(--green); outline-offset: 10px; }
    .workspace-footer {
      min-height: 35px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 20px;
      border-top: 1px solid var(--line);
      background: var(--surface);
      color: var(--muted);
      font-family: var(--mono);
      font-size: 9px;
    }
    .footer-hint { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .status-message { color: var(--green); white-space: nowrap; }
    .status-message.is-error { color: var(--red); }
    .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

    @media (min-width: 1200px) {
      .stage-area { padding: 32px 48px; }
    }
    @media (max-width: 760px) {
      .app-header { height: 58px; padding: 0 14px; }
      .session-label { display: none; }
      .app-layout { min-height: calc(100vh - 58px); grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); }
      .sidebar { min-height: 0; border-right: 0; border-bottom: 1px solid var(--line); }
      .sidebar-heading { padding: 10px 14px 8px; }
      .image-list { flex-direction: row; padding: 0 10px 9px; overflow-x: auto; overflow-y: hidden; }
      .image-row { width: 174px; min-width: 174px; min-height: 48px; grid-template-columns: 34px minmax(0, 1fr) 12px; padding: 5px; }
      .thumb-wrap { width: 34px; height: 34px; }
      .sidebar-bottom { padding: 0 10px 10px; border-top: 0; }
      .add-images-button { height: 32px; }
      .sidebar-note { display: none; }
      .workspace { min-height: 470px; }
      .workspace-topline { min-height: 48px; padding: 0 12px; }
      .current-image-title { font-size: 15px; }
      .tool-bar { gap: 5px; padding: 7px 9px; }
      .tool-group { gap: 1px; padding-right: 5px; }
      .tool-button { min-height: 32px; gap: 5px; padding: 0 7px; font-size: 10px; }
      .size-control { gap: 4px; padding: 0 2px; }
      input[type="range"] { width: 52px; }
      .size-label { display: none; }
      .toolbar-spacer { min-width: 4px; }
      .action-group { gap: 4px; }
      .record-button, .export-button { min-height: 32px; gap: 5px; padding: 0 8px; font-size: 9px; }
      .stage-area { min-height: 260px; padding: 12px; }
      .stage { min-height: 230px; }
      .workspace-footer { padding: 0 10px; }
    }
    @media (max-width: 430px) {
      .brand { gap: 8px; }
      .brand-name { font-size: 10px; }
      .brand-subtitle { font-size: 8px; }
      .brand-mark { width: 27px; height: 27px; }
      .header-meta { gap: 8px; }
      .record-indicator { min-width: auto; font-size: 9px; }
      .tool-group { border-right: 0; }
      .tool-button { gap: 4px; padding: 0 5px; }
      .tool-glyph { width: 12px; }
      .eraser-glyph { width: 10px; }
      .layer-button { font-size: 9px; }
      .record-button { width: 34px; padding: 0; font-size: 0; }
      #openParticipantButton, #toolsConditionButton { font-size: 12px; }
      #openParticipantButton span:last-child, #toolsConditionButton span:last-child { display: none; }
      .record-symbol { width: 9px; height: 9px; }
      .export-button { padding: 0 7px; }
      .footer-hint { max-width: 58%; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="brand" aria-label="Annotation Probe">
      <div class="brand-mark" aria-hidden="true">f.</div>
      <div>
        <!-- <div class="brand-name">FIELDNOTES</div>
        <div class="brand-subtitle">ANNOTATION LAB</div> -->
      </div>
    </div>
    <div class="header-meta">
      <div class="session-label">LOCAL SESSION</div>
      <div class="record-indicator" id="recordIndicator" aria-live="polite">
        <span class="record-dot" aria-hidden="true"></span>
        <span id="recordClock">READY 00:00</span>
      </div>
    </div>
  </header>

  <div class="app-layout">
    <aside class="sidebar" aria-label="Image sequence">
      <div class="sidebar-heading">
        <span class="eyebrow">Image sequence</span>
        <span class="image-count" id="imageCount">0 IMAGES</span>
      </div>
      <div class="image-list" id="imageList" aria-live="polite"></div>
      <div class="sidebar-bottom">
        <button class="add-images-button" id="addImagesButton" type="button">+ Add images</button>
        <!-- <p class="sidebar-note">Images stay in this browser session. Export the session before closing this tab.</p> -->
      </div>
    </aside>

    <main class="workspace">
      <div class="workspace-topline">
        <div class="participant-panel">
          <label class="participant-label" for="participantNumberInput">Participant</label>
          <input id="participantNumberInput" class="participant-field" type="text" maxlength="64" value="" placeholder="e.g. P-01" aria-label="Participant number">
        </div>
        <div class="current-image-title" id="currentImageTitle">New experiment session</div>
        <div class="image-navigation">
          <button class="nav-button" id="previousButton" type="button" aria-label="Previous image" title="Previous image" disabled>&lsaquo;</button>
          <span id="imagePosition">0 / 0</span>
          <button class="nav-button" id="nextButton" type="button" aria-label="Next image" title="Next image" disabled>&rsaquo;</button>
        </div>
      </div>

      <div class="tool-bar" role="toolbar" aria-label="Experiment controls">
        <button class="record-button" id="openParticipantButton" type="button" title="Open the participant drawing window" disabled>
          <span aria-hidden="true">↗</span><span>Participant window</span>
        </button>
        <button class="record-button" id="toolsConditionButton" type="button" aria-pressed="true" title="Toggle participant drawing tools">
          <span aria-hidden="true">✎</span><span id="toolsConditionText">Tools available</span>
        </button>
        <button class="layer-button" id="layerButton" type="button" aria-pressed="true" title="Show or hide annotation layer">
          <span class="layer-eye" aria-hidden="true">◉</span><span>Ink visible</span>
        </button>
        <div class="toolbar-spacer"></div>
        <div class="action-group">
          <button class="record-button" id="recordButton" type="button" title="Choose the participant display to record" disabled>
            <span class="record-symbol" aria-hidden="true"></span><span id="recordButtonText">Record display</span>
          </button>
          <button class="export-button" id="exportButton" type="button" disabled>
            <span aria-hidden="true">↓</span><span>Export session</span>
          </button>
        </div>
      </div>

      <section class="stage-area" aria-label="Image annotation canvas">
        <div class="stage" id="stage">
          <img class="artwork-image" id="artworkImage" alt="Current image">
          <canvas class="annotation-canvas" id="annotationCanvas" aria-label="Experimenter preview of participant annotations"></canvas>
          <div class="empty-state" id="emptyState">
            <div class="empty-illustration" aria-hidden="true"></div>
            <h1 class="empty-title">Start with an image</h1>
            <p class="empty-copy">Load the image sequence, open a participant window, and start the experiment.</p>
            <button class="add-images-button drop-target" id="emptyAddButton" type="button">Choose image files (PNG, JPEG, WebP)</button>
          </div>
        </div>
      </section>
      <footer class="workspace-footer">
        <!-- <span class="footer-hint" id="footerHint">Add images to begin. PNG, JPEG, and WebP supported.</span> -->
        <span class="status-message" id="statusMessage" role="status" aria-live="polite"></span>
      </footer>
    </main>
  </div>

  <input class="visually-hidden" id="imagePicker" type="file" accept="image/*" multiple>

  <script>
    (() => {
      const $ = (selector) => document.querySelector(selector);
      const imagePicker = $('#imagePicker');
      const imageList = $('#imageList');
      const stage = $('#stage');
      const artworkImage = $('#artworkImage');
      const annotationCanvas = $('#annotationCanvas');
      const annotationContext = annotationCanvas.getContext('2d');
      const items = [];
      const eventLog = [];
      const sessionId = globalThis.crypto?.randomUUID?.() || `session-${Date.now()}`;
      const sessionStartedAt = new Date().toISOString();
      const sessionStartedEpoch = Date.now();
      const channel = new BroadcastChannel(`annotation-probe-${sessionId}`);
      const sessionClockStart = performance.now();
      document.documentElement.dataset.sessionId = sessionId;
      let activeIndex = -1;
      let activeTool = 'pen';
      let activeColor = 'red';
      let activeSize = 'thin';
      let toolsEnabled = true;
      let inkVisible = true;
      let participantWindow = null;
      let recording = null;
      let recordingChunks = [];
      let recordingBlob = null;
      let recordingStartedAt = 0;
      let recordingTimer = 0;
      let statusTimer = 0;

      function getParticipantNumber() {
        return $('#participantNumberInput').value.trim();
      }

      function sanitizeParticipantNumber(value) {
        return value.replace(/[^a-zA-Z0-9._-]+/g, '_').replace(/^_+|_+$/g, '').slice(0, 40) || 'participant';
      }

      function elapsed() {
        return Math.round(performance.now() - sessionClockStart);
      }

      function logEvent(type, details = {}, timeMs = elapsed()) {
        eventLog.push({ timeMs: Math.max(0, Math.round(timeMs)), type, participantNumber: getParticipantNumber() || null, imageIndex: activeIndex >= 0 ? activeIndex : null, imageName: activeIndex >= 0 ? items[activeIndex].name : null, ...details });
      }

      function sendParticipant(message) {
        channel.postMessage(message);
      }

      function sendSessionSnapshot() {
        sendParticipant({
          type: 'session_snapshot',
          images: items.map((item) => ({ name: item.name, blob: item.file, strokes: item.strokes, undoActions: item.undoActions })),
          activeIndex,
          toolsEnabled,
          inkVisible,
          activeTool,
          activeColor,
          activeSize,
          participantNumber: getParticipantNumber()
        });
      }

      function setStatus(message, isError = false) {
        const status = $('#statusMessage');
        status.textContent = message;
        status.classList.toggle('is-error', isError);
        clearTimeout(statusTimer);
        if (message) statusTimer = setTimeout(() => { status.textContent = ''; status.classList.remove('is-error'); }, 3600);
      }

      function currentItem() {
        return activeIndex >= 0 ? items[activeIndex] : null;
      }

      function updateControls() {
        const hasItem = Boolean(currentItem());
        $('#imageCount').textContent = `${items.length} ${items.length === 1 ? 'IMAGE' : 'IMAGES'}`;
        $('#imagePosition').textContent = `${activeIndex >= 0 ? activeIndex + 1 : 0} / ${items.length}`;
        $('#previousButton').disabled = activeIndex <= 0;
        $('#nextButton').disabled = activeIndex < 0 || activeIndex >= items.length - 1;
        $('#openParticipantButton').disabled = items.length === 0;
        $('#recordButton').disabled = items.length === 0 || !('MediaRecorder' in window) || !navigator.mediaDevices?.getDisplayMedia;
        $('#exportButton').disabled = items.length === 0;
        $('#emptyState').hidden = hasItem;
        $('#artworkImage').style.display = hasItem ? 'block' : 'none';
        $('#annotationCanvas').style.display = hasItem ? 'block' : 'none';
        $('#currentImageTitle').textContent = hasItem ? currentItem().name : 'New experiment session';
        $('#footerHint').textContent = hasItem ? `${currentItem().image.naturalWidth} × ${currentItem().image.naturalHeight} px  ·  Participant tools ${toolsEnabled ? 'available' : 'hidden'}` : 'Add images to begin. PNG, JPEG, and WebP supported.';
        renderImageList();
      }

      function renderImageList() {
        imageList.replaceChildren();
        items.forEach((item, index) => {
          const button = document.createElement('button');
          button.className = 'image-row';
          button.type = 'button';
          button.setAttribute('aria-current', String(index === activeIndex));
          button.setAttribute('aria-label', `Show image ${index + 1}: ${item.name}`);
          const thumb = document.createElement('span');
          thumb.className = 'thumb-wrap';
          const thumbnail = document.createElement('img');
          thumbnail.src = item.url;
          thumbnail.alt = '';
          thumb.append(thumbnail);
          const details = document.createElement('span');
          const name = document.createElement('span');
          name.className = 'image-row-name';
          name.textContent = item.name;
          const number = document.createElement('span');
          number.className = 'image-row-index';
          number.textContent = `IMAGE ${String(index + 1).padStart(2, '0')}`;
          details.append(name, number);
          const mark = document.createElement('span');
          mark.className = `ink-mark${item.hasInk ? ' has-ink' : ''}`;
          mark.setAttribute('aria-label', item.hasInk ? 'Has annotations' : 'No annotations');
          button.append(thumb, details, mark);
          button.addEventListener('click', () => selectImage(index, 'experimenter'));
          imageList.append(button);
        });
      }

      function selectImage(index, source = 'experimenter') {
        if (index < 0 || index >= items.length || index === activeIndex) return;
        activeIndex = index;
        const item = currentItem();
        artworkImage.src = item.url;
        annotationCanvas.width = item.image.naturalWidth;
        annotationCanvas.height = item.image.naturalHeight;
        annotationContext.clearRect(0, 0, annotationCanvas.width, annotationCanvas.height);
        renderStrokes(annotationContext, item.strokes);
        layoutImage();
        updateControls();
        logEvent('image_change', { imageIndex: index, imageName: item.name, source });
        sendParticipant({ type: 'active_image', index });
      }

      function layoutImage() {
        const item = currentItem();
        if (!item) return;
        const bounds = stage.getBoundingClientRect();
        const scale = Math.min(bounds.width / item.image.naturalWidth, bounds.height / item.image.naturalHeight);
        const width = Math.max(1, item.image.naturalWidth * scale);
        const height = Math.max(1, item.image.naturalHeight * scale);
        const left = (bounds.width - width) / 2;
        const top = (bounds.height - height) / 2;
        for (const element of [artworkImage, annotationCanvas]) {
          element.style.width = `${width}px`;
          element.style.height = `${height}px`;
          element.style.left = `${left}px`;
          element.style.top = `${top}px`;
        }
      }

      function renderImageListMarks() {
        items.forEach((item, index) => {
          const mark = imageList.children[index]?.querySelector('.ink-mark');
          if (mark) {
            mark.classList.toggle('has-ink', item.hasInk);
            mark.setAttribute('aria-label', item.hasInk ? 'Has annotations' : 'No annotations');
          }
        });
      }

      async function addImageFiles(files) {
        const selectedFiles = [...files].filter((file) => file.type.startsWith('image/'));
        if (selectedFiles.length === 0) {
          setStatus('Choose one or more image files.', true);
          return;
        }
        for (const file of selectedFiles) {
          const url = URL.createObjectURL(file);
          try {
            const image = new Image();
            image.decoding = 'async';
            image.src = url;
            await image.decode();
            items.push({ name: file.name, file, url, image, strokes: [], undoActions: [], hasInk: false });
          } catch (error) {
            URL.revokeObjectURL(url);
            setStatus(`Could not open ${file.name}.`, true);
          }
        }
        updateControls();
        sendParticipant({ type: 'sequence_update', images: items.map((item) => ({ name: item.name, blob: item.file, strokes: item.strokes, undoActions: item.undoActions })) });
        if (activeIndex < 0 && items.length) selectImage(0);
        else renderImageList();
        logEvent('images_added', { count: selectedFiles.length, names: selectedFiles.map((file) => file.name) });
        if (items.length) setStatus(`${items.length} ${items.length === 1 ? 'image' : 'images'} ready`);
      }

      function getPoint(event) {
        const rect = annotationCanvas.getBoundingClientRect();
        return {
          x: (event.clientX - rect.left) / rect.width * annotationCanvas.width,
          y: (event.clientY - rect.top) / rect.height * annotationCanvas.height,
          normalizedX: (event.clientX - rect.left) / rect.width,
          normalizedY: (event.clientY - rect.top) / rect.height,
          pressure: event.pressure || 0.5,
          pointerType: event.pointerType || 'mouse'
        };
      }

      function renderStrokes(context, strokes) {
        context.clearRect(0, 0, context.canvas.width, context.canvas.height);
        for (const stroke of strokes) {
          const first = stroke.points[0];
          if (!first) continue;
          context.globalCompositeOperation = stroke.tool === 'eraser' ? 'destination-out' : 'source-over';
          context.strokeStyle = stroke.color;
          context.lineWidth = stroke.widthPx;
          context.lineCap = 'round';
          context.lineJoin = 'round';
          context.beginPath();
          context.moveTo(first.x, first.y);
          context.lineTo(first.x + 0.01, first.y + 0.01);
          context.stroke();
          for (let index = 1; index < stroke.points.length; index++) {
            const previous = stroke.points[index - 1];
            const point = stroke.points[index];
            context.beginPath();
            context.moveTo(previous.x, previous.y);
            context.lineTo(point.x, point.y);
            context.stroke();
          }
        }
        context.globalCompositeOperation = 'source-over';
      }

      function applyParticipantMessage(message) {
        const index = Number(message.imageIndex);
        const item = Number.isInteger(index) ? items[index] : null;
        if (message.type === 'participant_ready') {
          sendSessionSnapshot();
          setStatus('Participant window connected');
          return;
        }
        if (message.type === 'navigate') {
          selectImage(index, 'participant');
          return;
        }
        if (message.type === 'stroke' && item && message.stroke?.points?.length) {
          const stroke = message.stroke;
          item.undoActions.push({ type: 'stroke' });
          item.strokes.push(stroke);
          item.hasInk = item.strokes.some((entry) => entry.tool !== 'eraser');
          const first = stroke.points[0];
          logEvent('stroke_start', { imageIndex: index, imageName: item.name, tool: stroke.tool, color: stroke.color, size: stroke.size, pointerType: first.pointerType, x: first.normalizedX, y: first.normalizedY }, stroke.startedAt - sessionStartedEpoch);
          for (const point of stroke.points.slice(1)) {
            logEvent('stroke_point', { imageIndex: index, imageName: item.name, tool: stroke.tool, color: stroke.color, size: stroke.size, pointerType: point.pointerType, x: point.normalizedX, y: point.normalizedY, pressure: point.pressure }, point.timeMs - sessionStartedEpoch);
          }
          logEvent('stroke_end', { imageIndex: index, imageName: item.name, tool: stroke.tool, color: stroke.color, size: stroke.size }, stroke.endedAt - sessionStartedEpoch);
          if (index === activeIndex) renderStrokes(annotationContext, item.strokes);
          renderImageListMarks();
          return;
        }
        if (message.type === 'undo' && item) {
          const action = item.undoActions.pop();
          if (!action) return;
          item.strokes = action.type === 'clear' ? action.strokes : item.strokes.slice(0, -1);
          item.hasInk = item.strokes.some((stroke) => stroke.tool !== 'eraser');
          logEvent('undo', { imageIndex: index, imageName: item.name });
          if (index === activeIndex) renderStrokes(annotationContext, item.strokes);
          renderImageListMarks();
          return;
        }
        if (message.type === 'clear' && item) {
          item.undoActions.push({ type: 'clear', strokes: item.strokes });
          item.strokes = [];
          item.hasInk = false;
          logEvent('clear_annotations', { imageIndex: index, imageName: item.name });
          if (index === activeIndex) renderStrokes(annotationContext, item.strokes);
          renderImageListMarks();
          return;
        }
        if (message.type === 'tool_change') {
          activeTool = message.tool;
          logEvent('tool_change', { imageIndex: index, imageName: item?.name, tool: message.tool });
        }
        if (message.type === 'color_change') {
          activeColor = message.color;
          logEvent('pen_color_change', { imageIndex: index, imageName: item?.name, color: message.color });
        }
        if (message.type === 'size_change') {
          activeSize = message.size;
          logEvent('pen_size_change', { imageIndex: index, imageName: item?.name, size: message.size });
        }
      }

      async function startRecording() {
        if (recording || !currentItem()) return;
        let stream;
        try {
          stream = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: 30 }, audio: false });
          recordingChunks = [];
          recordingBlob = null;
          const mimeType = typeof MediaRecorder.isTypeSupported === 'function'
            ? ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'].find((type) => MediaRecorder.isTypeSupported(type))
            : '';
          recording = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
        } catch (error) {
          stream?.getTracks().forEach((track) => track.stop());
          setStatus(error.name === 'NotAllowedError' ? 'Display capture was cancelled.' : 'Display recording is not available in this browser.', true);
          recording = null;
          return;
        }
        recordingStartedAt = performance.now();
        const activeStream = stream;
        recording.ondataavailable = (event) => { if (event.data.size) recordingChunks.push(event.data); };
        recording.onstop = () => {
          recordingBlob = new Blob(recordingChunks, { type: recording.mimeType || 'video/webm' });
          activeStream.getTracks().forEach((track) => track.stop());
          recording = null;
          clearInterval(recordingTimer);
          $('#recordIndicator').classList.remove('is-recording');
          $('#recordClock').textContent = `READY ${formatDuration(performance.now() - recordingStartedAt)}`;
          $('#recordButton').classList.remove('is-recording');
          $('#recordButton').title = 'Choose a display or window to record';
          $('#recordButtonText').textContent = 'Record display';
          logEvent('recording_stopped', { durationMs: Math.round(performance.now() - recordingStartedAt) });
          setStatus(recordingBlob.size ? 'Recording ready to export' : 'No video frames captured. Keep the display visible while recording.', !recordingBlob.size);
          updateControls();
        };
        recording.start(1000);
        activeStream.getVideoTracks()[0]?.addEventListener('ended', () => {
          if (recording?.state === 'recording') recording.stop();
        }, { once: true });
        $('#recordIndicator').classList.add('is-recording');
        $('#recordButton').classList.add('is-recording');
        $('#recordButton').title = 'Stop screen recording';
        $('#recordButtonText').textContent = 'Stop';
        logEvent('recording_started');
        recordingTimer = setInterval(() => {
          $('#recordClock').textContent = `REC ${formatDuration(performance.now() - recordingStartedAt)}`;
        }, 250);
      }

      function stopRecording() {
        if (!recording) return Promise.resolve();
        return new Promise((resolve) => {
          const activeRecorder = recording;
          activeRecorder.addEventListener('stop', resolve, { once: true });
          if (activeRecorder.state === 'recording') activeRecorder.stop();
        });
      }

      function formatDuration(milliseconds) {
        const seconds = Math.floor(milliseconds / 1000);
        return `${String(Math.floor(seconds / 60)).padStart(2, '0')}:${String(seconds % 60).padStart(2, '0')}`;
      }

      function canvasToBlob(canvas, type = 'image/png') {
        return new Promise((resolve, reject) => canvas.toBlob((blob) => blob ? resolve(blob) : reject(new Error('Could not export image')), type));
      }

      function crc32(bytes) {
        let crc = -1;
        for (const byte of bytes) {
          crc ^= byte;
          for (let bit = 0; bit < 8; bit++) crc = (crc >>> 1) ^ (crc & 1 ? 0xedb88320 : 0);
        }
        return (crc ^ -1) >>> 0;
      }

      function zipStore(files) {
        const encoder = new TextEncoder();
        const localParts = [];
        const centralParts = [];
        let localOffset = 0;
        const dosTime = 0;
        const dosDate = ((new Date().getFullYear() - 1980) << 9) | ((new Date().getMonth() + 1) << 5) | new Date().getDate();
        for (const file of files) {
          const name = encoder.encode(file.name);
          const bytes = file.bytes;
          const checksum = crc32(bytes);
          const local = new Uint8Array(30 + name.length);
          const localView = new DataView(local.buffer);
          localView.setUint32(0, 0x04034b50, true);
          localView.setUint16(4, 20, true);
          localView.setUint16(6, 0x0800, true);
          localView.setUint16(8, 0, true);
          localView.setUint16(10, dosTime, true);
          localView.setUint16(12, dosDate, true);
          localView.setUint32(14, checksum, true);
          localView.setUint32(18, bytes.length, true);
          localView.setUint32(22, bytes.length, true);
          localView.setUint16(26, name.length, true);
          local.set(name, 30);
          localParts.push(local, bytes);

          const central = new Uint8Array(46 + name.length);
          const centralView = new DataView(central.buffer);
          centralView.setUint32(0, 0x02014b50, true);
          centralView.setUint16(4, 20, true);
          centralView.setUint16(6, 20, true);
          centralView.setUint16(8, 0x0800, true);
          centralView.setUint16(10, 0, true);
          centralView.setUint16(12, dosTime, true);
          centralView.setUint16(14, dosDate, true);
          centralView.setUint32(16, checksum, true);
          centralView.setUint32(20, bytes.length, true);
          centralView.setUint32(24, bytes.length, true);
          centralView.setUint16(28, name.length, true);
          centralView.setUint32(42, localOffset, true);
          central.set(name, 46);
          centralParts.push(central);
          localOffset += local.length + bytes.length;
        }
        const centralSize = centralParts.reduce((total, part) => total + part.length, 0);
        const end = new Uint8Array(22);
        const endView = new DataView(end.buffer);
        endView.setUint32(0, 0x06054b50, true);
        endView.setUint16(8, files.length, true);
        endView.setUint16(10, files.length, true);
        endView.setUint32(12, centralSize, true);
        endView.setUint32(16, localOffset, true);
        return new Blob([...localParts, ...centralParts, end], { type: 'application/zip' });
      }

      function safeFilename(name) {
        return name.replace(/\.[^.]+$/, '').normalize('NFKD').replace(/[^a-zA-Z0-9_-]+/g, '_').replace(/^_+|_+$/g, '').slice(0, 80) || 'image';
      }

      async function exportSession() {
        if (!items.length) return;
        $('#exportButton').disabled = true;
        setStatus('Preparing session export…');
        try {
          if (recording) await stopRecording();
          const files = [];
          for (const [index, item] of items.entries()) {
            const finalCanvas = document.createElement('canvas');
            finalCanvas.width = item.image.naturalWidth;
            finalCanvas.height = item.image.naturalHeight;
            const context = finalCanvas.getContext('2d');
            const annotationCopy = document.createElement('canvas');
            annotationCopy.width = item.image.naturalWidth;
            annotationCopy.height = item.image.naturalHeight;
            renderStrokes(annotationCopy.getContext('2d'), item.strokes);
            context.drawImage(item.image, 0, 0);
            context.drawImage(annotationCopy, 0, 0);
            const blob = await canvasToBlob(finalCanvas);
            const filename = `${String(index + 1).padStart(3, '0')}_${safeFilename(item.name)}_annotated.png`;
            files.push({ name: `images/${filename}`, bytes: new Uint8Array(await blob.arrayBuffer()) });
          }
          const participantNumberValue = getParticipantNumber();
          const sessionFilename = participantNumberValue ? `${sanitizeParticipantNumber(participantNumberValue)}_${new Date().toISOString().slice(0, 10)}` : `test_${new Date().toISOString().slice(0, 10)}`;
          const manifest = {
            sessionId,
            participantNumber: participantNumberValue || null,
            startedAt: sessionStartedAt,
            exportedAt: new Date().toISOString(),
            durationMs: elapsed(),
            images: items.map((item, index) => ({ index, name: item.name, width: item.image.naturalWidth, height: item.image.naturalHeight, annotated: item.hasInk })),
            recording: recordingBlob?.size ? { file: 'recording.webm', mimeType: recordingBlob.type } : null,
            events: eventLog
          };
          files.push({ name: 'interaction.json', bytes: new TextEncoder().encode(JSON.stringify(manifest, null, 2)) });
          if (recordingBlob?.size) files.push({ name: 'recording.webm', bytes: new Uint8Array(await recordingBlob.arrayBuffer()) });
          const archive = zipStore(files);
          downloadBlob(archive, `${sessionFilename}.zip`);
          setStatus(`${items.length} images and interaction log exported`);
        } catch (error) {
          console.error(error);
          setStatus('Export failed. Try smaller images or another browser.', true);
        } finally {
          updateControls();
        }
      }

      function downloadBlob(blob, filename) {
        const link = document.createElement('a');
        const url = URL.createObjectURL(blob);
        link.href = url;
        link.download = filename;
        link.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }

      $('#participantNumberInput').addEventListener('input', () => {
        const value = getParticipantNumber();
        logEvent('participant_number_updated', { participantNumber: value || null });
        sendParticipant({ type: 'participant_number', value });
      });
      $('#addImagesButton').addEventListener('click', () => imagePicker.click());
      $('#emptyAddButton').addEventListener('click', () => imagePicker.click());
      imagePicker.addEventListener('change', async (event) => {
        await addImageFiles(event.target.files);
        imagePicker.value = '';
      });
      $('#openParticipantButton').addEventListener('click', () => {
        if (participantWindow && !participantWindow.closed) {
          participantWindow.focus();
          sendSessionSnapshot();
          return;
        }
        participantWindow = window.open(`participant.html?session=${encodeURIComponent(sessionId)}`, `annotation-participant-${sessionId}`, 'popup,width=1200,height=900');
        if (!participantWindow) {
          setStatus('Allow popups to open the participant window.', true);
          return;
        }
        logEvent('participant_window_opened');
        setStatus('Participant window opened');
      });
      $('#toolsConditionButton').addEventListener('click', () => {
        toolsEnabled = !toolsEnabled;
        $('#toolsConditionButton').setAttribute('aria-pressed', String(toolsEnabled));
        $('#toolsConditionText').textContent = toolsEnabled ? 'Tools available' : 'No-tools condition';
        logEvent('tools_condition_change', { toolsEnabled, condition: toolsEnabled ? 'tools' : 'no_tools' });
        sendParticipant({ type: 'tools_enabled', enabled: toolsEnabled });
        setStatus(toolsEnabled ? 'Participant tools enabled' : 'Participant tools hidden');
        updateControls();
      });
      $('#previousButton').addEventListener('click', () => selectImage(activeIndex - 1));
      $('#nextButton').addEventListener('click', () => selectImage(activeIndex + 1));
      $('#layerButton').addEventListener('click', () => {
        inkVisible = !inkVisible;
        annotationCanvas.style.visibility = inkVisible ? 'visible' : 'hidden';
        $('#layerButton').setAttribute('aria-pressed', String(inkVisible));
        $('#layerButton').innerHTML = `<span class="layer-eye" aria-hidden="true">${inkVisible ? '◉' : '◎'}</span><span>${inkVisible ? 'Ink visible' : 'Ink hidden'}</span>`;
        logEvent('annotation_layer_visibility', { visible: inkVisible });
        sendParticipant({ type: 'annotation_visibility', visible: inkVisible });
      });
      $('#recordButton').addEventListener('click', () => recording ? stopRecording() : startRecording());
      $('#exportButton').addEventListener('click', exportSession);
      channel.addEventListener('message', (event) => applyParticipantMessage(event.data));
      stage.addEventListener('dragover', (event) => { event.preventDefault(); stage.classList.add('is-dragging'); });
      stage.addEventListener('dragleave', (event) => { if (!stage.contains(event.relatedTarget)) stage.classList.remove('is-dragging'); });
      stage.addEventListener('drop', async (event) => {
        event.preventDefault();
        stage.classList.remove('is-dragging');
        await addImageFiles(event.dataTransfer.files);
      });
      window.addEventListener('keydown', (event) => {
        if (event.target instanceof HTMLInputElement) return;
        if (event.key === 'ArrowLeft') selectImage(activeIndex - 1);
        if (event.key === 'ArrowRight') selectImage(activeIndex + 1);
      });
      const resizeObserver = new ResizeObserver(layoutImage);
      resizeObserver.observe(stage);
      logEvent('session_started', { sessionId });
      updateControls();
    })();
  </script>
</body>
</html>
